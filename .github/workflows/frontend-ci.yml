name: Frontend CI
on:
  push:
    branches: [ main, dev, frontend-dev ]
    paths:
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/wokflows/frontend-ci.yaml"
  pull_request:
    branches: [ main, dev, frontend-dev ]
    paths:
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/wokflows/frontend-ci.yaml"

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and run linters
        run: |
          cd ./frontend
          npm ci
          npm run lint