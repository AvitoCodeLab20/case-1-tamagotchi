services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - REPORT_SERVICE_URL=http://report-service:8000
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} psql -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c '\\q' -q"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:17-alpine
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
    volumes:
      - ./backend/migration:/migrations:ro
    entrypoint: ["sh", "/migrations/apply.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - incident-service
volumes:
  postgres_data:
